name: Android Build, Test & APK Artifact

on:
  push:
    branches:
      - main
      - master
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test-apk:
    name: Compile, Run Tests & Package Installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Keystore & Environment Files
        run: |
          # 1. Restore debug.keystore from debug.keystore.base64 (since debug.keystore is in .gitignore)
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard Android debug.keystore..."
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Ensure .env file exists for Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Run Unit & Robolectric Verification Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload Unit & Robolectric Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aether-OS-18-Test-Report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Build Signed Installable Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Aether-OS-18-installable.apk

      - name: Upload Installable Phone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aether-OS-18-Phone-APK
          path: app/build/outputs/apk/debug/Aether-OS-18-installable.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/Aether-OS-18-installable.apk
          generate_release_notes: true
